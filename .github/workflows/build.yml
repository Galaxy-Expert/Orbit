name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ilk calismada: repo kokundeki zip'i acar, dosyalari repo'ya commit'ler ve zip'i siler.
      # Sonraki calismalarda (app/ klasoru varsa) bu adim atlanir.
      - name: Unpack source zip (first run only)
        run: |
          if [ -f Orbit-0.1.0-src.zip ] && [ ! -d app ]; then
            unzip -q Orbit-0.1.0-src.zip
            rm -rf Orbit/.github
            cp -r Orbit/. .
            rm -rf Orbit Orbit-0.1.0-src.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add Orbit 0.1.0 sources"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
