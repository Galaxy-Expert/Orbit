name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Repo kokune Orbit-*-src.zip yuklenirse: acilir, dosyalar repo'ya commit'lenir, zip silinir.
      # LICENSE yoksa resmi GPL-3.0 metni gnu.org'dan indirilip eklenir.
      - name: Unpack source zip (if present)
        run: |
          shopt -s nullglob
          zips=(Orbit-*-src.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              unzip -q -o "$z"
              rm -rf Orbit/.github
              cp -r Orbit/. .
              rm -rf Orbit "$z"
            done
            if [ ! -f LICENSE ]; then
              curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o LICENSE || echo "::warning::LICENSE could not be downloaded"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update Orbit sources from zip"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Anahtar GitHub Secrets'tan okunur. Yoksa APK debug anahtarıyla imzalanır (uyarı verir).
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit.jks"
            echo "ORBIT_KEYSTORE_PATH=$RUNNER_TEMP/orbit.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ORBIT_KEYSTORE_BASE64 secret not set: APK will be signed with a throwaway debug key and will NOT update over a previous install."
          fi

      - name: Build release APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "dist/Orbit-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-v${{ env.VERSION }}
          path: dist/*.apk

      # v0.1.0 gibi bir tag (ya da bu tag ile olusturulan Release) APK'yi Release'e ekler.
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
